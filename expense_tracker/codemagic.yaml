workflows:
  android-release:
    name: Android Release Build
    environment:
      flutter: stable
      android: latest
    cache:
      cache_path: ~/.cache
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
        - pattern: release/*
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --release
      - name: Build Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/*.aab
      - build/**/flutter_*.log
    publishing:
      email:
        recipients:
          - $EMAIL_RECIPIENTS

  ios-release:
    name: iOS Release Build
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_path: ~/.cache
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
        - pattern: release/*
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS Release
        script: flutter build ios --release --no-codesign
      - name: Generate IPA
        script: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r9 ../../ipa/expense_tracker.ipa Payload/
          rm -rf Payload
    artifacts:
      - build/ios/ipa/*.ipa
      - build/**/flutter_*.log
    publishing:
      email:
        recipients:
          - $EMAIL_RECIPIENTS
